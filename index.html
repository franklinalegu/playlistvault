<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self'; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <meta name="description" content="Analyze YouTube playlists and Udemy courses in the browser. Use instantly on the web or install as an app — no signup." />

    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0C0F1A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PlaylistVault" />
    <link rel="apple-touch-icon" href="./icons/icon-512.png" />
    <link rel="icon" type="image/png" href="./icons/icon-512.png" />
  </head>
  <body class="bg-vault-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

name: CI

# Runs on every push and PR to main. Catches type errors, lint failures and
# broken tests before they reach a release build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # electron-builder's postinstall pulls Electron binaries we don't need
      # just to typecheck and test, so skip it for a much faster job.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build renderer and main
        run: npx vite build

  binaries-sanity:
    name: Binary download sanity (no missing yt-dlp release)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fetch binaries (yt-dlp + ffmpeg)
        run: npm run fetch:binaries -- --force
      - name: Verify yt-dlp and ffmpeg are executable
        run: |
          ls -lh resources/bin/
          ./resources/bin/yt-dlp --version
          test -f resources/bin/yt-dlp || test -f resources/bin/yt-dlp.exe
          # FFmpeg is not auto-fetched on Linux (use apt); only check on Windows/macOS runners
          if [ -f resources/bin/ffmpeg ] || [ -f resources/bin/ffmpeg.exe ]; then
            ./resources/bin/ffmpeg -version | head -n 1
          else
            echo "ffmpeg not in resources/bin on Linux — skipping (expected)"
          fi

name: Android APK (sideload)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android (minSdk 29 = Android 10)
        run: |
          echo "capacitor.config.ts:"
          cat capacitor.config.ts || true
          ls -la dist/ | head -20 || true
          ls -la android/ | head -20 || true
          npx cap copy android --verbose || echo "cap copy failed, continuing"
          npx cap update android --verbose || echo "cap update failed, continuing"
          ls -lh android/app/src/main/assets/public/ || true

      # Debug APK for manual sideload — no Play Store, no signing required
      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PlaylistVault-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # Release APK — signed if ANDROID_KEYSTORE_BASE64 secrets are set,
      # otherwise unsigned (still sideloadable with "Allow unknown apps")
      - name: Build release APK (if keystore present)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
              -Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD
          else
            ./gradlew assembleRelease --stacktrace
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: PlaylistVault-android-release
          path: android/app/build/outputs/apk/release/app-release*.apk
          retention-days: 90

  # Attach APK to GitHub Release when tag is pushed (sideload distribution)
  publish-apk:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PlaylistVault-android-release
          path: ./apk

      - name: Attach APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/**/*.apk
          body: |
            **Android 10+ APK (sideload)** — no Play Store needed.
            1. Download `app-release.apk` (or `app-debug.apk` from workflow artifacts for PRs)
            2. On phone: Settings → Security → Install unknown apps → Allow for your browser/file manager
            3. Tap the APK to install. Supports Android 10 (API 29) through Android 15 (API 35).
            yt-dlp/ffmpeg native bridge is stubbed in this build; full download support lands in v5.3 (NewPipeExtractor/Chaquopy).

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build windows
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Fetch Windows binaries
        run: npm run fetch:binaries -- --arch=x64

      - name: Build renderer, main and preload
        run: npx vite build

      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}"

      - name: Package Windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PlaylistVault-windows
          path: |
            release/*/PlaylistVault-*.exe
            release/*/latest.yml
            release/*/PlaylistVault-*.blockmap
          if-no-files-found: error

  build-mac-x64:
    name: Build macos Intel
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Fetch macOS Intel binaries
        run: npm run fetch:binaries -- --arch=x64

      - name: Build renderer, main and preload
        run: npx vite build

      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}"

      - name: Package macOS unsigned
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg zip --x64 --publish never

      - name: Rename macOS metadata
        shell: bash
        run: |
          metadata=$(find release -type f -name 'latest-mac.yml' -print -quit)
          if [ -z "$metadata" ]; then
            echo 'latest-mac.yml was not generated'
            exit 1
          fi
          mv "$metadata" "$(dirname "$metadata")/latest-mac-x64.yml"

      - name: Upload macOS Intel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PlaylistVault-macos-x64
          path: |
            release/*/PlaylistVault-*.dmg
            release/*/PlaylistVault-*.zip
            release/*/latest-mac-x64.yml
            release/*/PlaylistVault-*.blockmap
          if-no-files-found: error

  build-mac-arm64:
    name: Build macOS Apple Silicon
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Fetch macOS Apple Silicon binaries
        run: npm run fetch:binaries -- --arch=arm64

      - name: Build renderer, main and preload
        run: npx vite build

      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}"

      - name: Package macOS unsigned
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg zip --arm64 --publish never

      - name: Rename macOS metadata
        shell: bash
        run: |
          metadata=$(find release -type f -name 'latest-mac.yml' -print -quit)
          if [ -z "$metadata" ]; then
            echo 'latest-mac.yml was not generated'
            exit 1
          fi
          mv "$metadata" "$(dirname "$metadata")/latest-mac-arm64.yml"

      - name: Upload macOS Apple Silicon artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PlaylistVault-macos-arm64
          path: |
            release/*/PlaylistVault-*.dmg
            release/*/PlaylistVault-*.zip
            release/*/latest-mac-arm64.yml
            release/*/PlaylistVault-*.blockmap
          if-no-files-found: error

  publish-windows:
    name: Publish Windows release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: PlaylistVault-windows
          path: release

      - name: Publish Windows release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t assets < <(find release -type f \( -name 'PlaylistVault-*.exe' -o -name 'latest.yml' -o -name 'PlaylistVault-*.blockmap' \))
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "PlaylistVault ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi

  publish-mac:
    name: Publish macOS release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mac-x64, build-mac-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS Intel artifacts
        uses: actions/download-artifact@v4
        with:
          name: PlaylistVault-macos-x64
          path: release

      - name: Download macOS Apple Silicon artifacts
        uses: actions/download-artifact@v4
        with:
          name: PlaylistVault-macos-arm64
          path: release

      - name: Set up Node for metadata merge
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check out for metadata tooling
        uses: actions/checkout@v4

      - name: Install metadata tooling
        run: npm ci --ignore-scripts

      - name: Merge macOS metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const yaml = require('js-yaml');
          const release = 'release';
          const files = fs.readdirSync(release, { recursive: true })
            .filter((name) => /^latest-mac-(x64|arm64)\.yml$/.test(path.basename(name)))
            .map((name) => path.join(release, name));
          if (files.length !== 2) throw new Error(`Expected two macOS metadata files, found ${files.length}`);
          const docs = files.map((file) => yaml.load(fs.readFileSync(file, 'utf8')));
          const merged = {
            version: docs[0].version,
            files: docs.flatMap((doc) => doc.files ?? []),
            releaseDate: docs[0].releaseDate
          };
          fs.writeFileSync(path.join(release, 'latest-mac.yml'), yaml.dump(merged, { noRefs: true }));
          for (const file of files) fs.rmSync(file);
          NODE

      - name: Publish macOS release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t assets < <(find release -type f \( -name 'PlaylistVault-*.dmg' -o -name 'PlaylistVault-*.zip' -o -name 'latest-mac.yml' -o -name 'PlaylistVault-*.blockmap' \))
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "PlaylistVault ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi

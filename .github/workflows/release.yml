name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            arch: x64
            build_args: '--win nsis portable --x64'
            artifact: PlaylistVault-windows
          - platform: macos
            runner: macos-13
            arch: x64
            build_args: '--mac dmg zip --x64'
            artifact: PlaylistVault-macos-x64
          - platform: macos
            runner: macos-latest
            arch: arm64
            build_args: '--mac dmg zip --arm64'
            artifact: PlaylistVault-macos-arm64

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Fetch platform binaries
        run: npm run fetch:binaries -- --arch=${{ matrix.arch }}

      - name: Build renderer, main and preload
        run: npx vite build

      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}"

      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (matrix.platform == 'windows' && secrets.CSC_LINK != '') || (matrix.platform == 'macos' && secrets.CSC_LINK_MAC != '') }}
          CSC_LINK: ${{ matrix.platform == 'windows' && secrets.CSC_LINK || matrix.platform == 'macos' && secrets.CSC_LINK_MAC || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'windows' && secrets.CSC_KEY_PASSWORD || matrix.platform == 'macos' && secrets.CSC_KEY_PASSWORD_MAC || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder ${{ matrix.build_args }} --publish never

      - name: Preserve macOS update metadata by architecture
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          metadata=$(find release -type f -name 'latest-mac.yml' -print -quit)
          if [ -z "$metadata" ]; then
            echo 'latest-mac.yml was not generated'
            exit 1
          fi
          mv "$metadata" "$(dirname "$metadata")/latest-mac-${{ matrix.arch }}.yml"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/**/*.exe
            release/**/*.dmg
            release/**/*.zip
            release/**/*.yml
            release/**/*.blockmap
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: PlaylistVault-windows
          path: release

      - name: Download macOS Intel artifacts
        uses: actions/download-artifact@v4
        with:
          name: PlaylistVault-macos-x64
          path: release

      - name: Download macOS Apple Silicon artifacts
        uses: actions/download-artifact@v4
        with:
          name: PlaylistVault-macos-arm64
          path: release

      - name: Set up Node for metadata merge
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install metadata tooling
        run: npm ci --ignore-scripts

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const yaml = require('js-yaml');
          const release = 'release';
          const files = fs.readdirSync(release, { recursive: true })
            .filter((name) => /^latest-mac-(x64|arm64)\.yml$/.test(path.basename(name)))
            .map((name) => path.join(release, name));
          if (files.length !== 2) throw new Error(`Expected two macOS metadata files, found ${files.length}`);
          const docs = files.map((file) => yaml.load(fs.readFileSync(file, 'utf8')));
          const merged = {
            version: docs[0].version,
            files: docs.flatMap((doc) => doc.files ?? []),
            releaseDate: docs[0].releaseDate
          };
          fs.writeFileSync(path.join(release, 'latest-mac.yml'), yaml.dump(merged, { noRefs: true }));
          for (const file of files) fs.rmSync(file);
          NODE
          mapfile -t assets < <(find release -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.yml' -o -name '*.blockmap' \))
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PlaylistVault ${GITHUB_REF_NAME#v}" \
            --generate-notes

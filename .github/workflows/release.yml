name: Release

# Builds the Windows installer on a real Windows runner and publishes it as a
# GitHub Release. Triggered by pushing a version tag:
#
#   npm version patch      # bumps package.json and creates the tag
#   git push --follow-tags
#
# Can also be run manually from the Actions tab to produce a draft.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 2.0.1). Defaults to package.json.'
        required: false

permissions:
  contents: write # required to create the release and upload assets

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail fast: never publish a release that doesn't typecheck or pass tests.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # yt-dlp only. FFmpeg is fetched by the app on first run, which keeps the
      # installer near 95 MB instead of ~144 MB.
      - name: Fetch bundled yt-dlp
        run: node scripts/fetch-binaries.mjs --no-ffmpeg

      # electron-builder only packages what already exists: its `files` config
      # points at dist/ and dist-electron/, both gitignored. Without this step
      # they are absent on a fresh checkout and the build fails immediately.
      - name: Build renderer, main and preload
        run: npx vite build

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          if ($pkg -ne $tag) {
            Write-Error "Tag v$tag does not match package.json version $pkg. Bump the version and re-tag."
            exit 1
          }
          Write-Host "Version check passed: $pkg"

      # Two explicit steps rather than one with inline conditionals. The
      # previous single-step version interpolated both the --publish value and
      # an EP_DRAFT env var, and failed in 6s before electron-builder even
      # started. Keeping the commands literal makes failures readable.
      - name: Build and publish (tagged release)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always

      - name: Build only (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Show what was produced
        if: always()
        shell: pwsh
        run: |
          if (Test-Path release) {
            Get-ChildItem release -Recurse -Include *.exe, *.yml, *.blockmap |
              Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
          } else {
            Write-Host 'No release directory was produced.'
          }

      # Keep the build even when not publishing, so manual runs are still useful.
      # Publish to Cloudflare R2 so downloads keep working when the repo goes
      # private. Skipped automatically if the secrets are absent, so the build
      # never breaks for anyone who hasn't configured R2.
      - name: Upload installer to Cloudflare R2
        if: startsWith(github.ref, 'refs/tags/v') && env.R2_ACCESS_KEY_ID != ''
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Recurse -Filter *.exe |
                 Where-Object { $_.Name -notmatch 'portable' } |
                 Select-Object -First 1
          if (-not $exe) { Write-Error 'No installer found to upload'; exit 1 }

          # latest.yml drives the in-app updater, so it must ship alongside.
          $yml = Get-ChildItem release -Recurse -Filter latest.yml | Select-Object -First 1

          pip install --quiet --disable-pip-version-check boto3
          $env:UPLOAD_EXE = $exe.FullName
          $env:UPLOAD_YML = if ($yml) { $yml.FullName } else { '' }
          $env:UPLOAD_VERSION = '${{ github.ref_name }}'
          python scripts/upload-r2.py

      - name: Upload installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlaylistVault-windows-installer
          path: |
            release/**/*.exe
            release/**/latest.yml
            release/**/*.blockmap
          retention-days: 14
          if-no-files-found: error
